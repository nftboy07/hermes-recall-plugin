manifest_version: 2
name: recall
version: 1.0.0
description: >-
  Spaced repetition inside Hermes Agent. Anything worth remembering —
  a command, a fact, a word, an API quirk — becomes a flashcard,
  scheduled with the SM-2 algorithm in a local SQLite store. When cards
  are due, the agent offers a quick quiz at the start of a session;
  grades adapt each card's interval (1 day, 6 days, then exponential).
author: Recall maintainers
license: MIT
tags:
  - learning
  - flashcards
  - spaced-repetition
  - memory
  - productivity
requires_hermes: ">=0.21.5"
python_dependencies: []
provides_tools:
  - recall_add
  - recall_grade
  - recall_due
  - recall_stats
provides_hooks:
  - pre_llm_call
  - on_session_start
config_schema:
  quiz_size:
    type: int
    default: 3
    description: >-
      How many due-card fronts the once-per-session note previews
      (1-10). The note itself always reports the full due count.
